dungeon:
  # Assigned once per map. Leave blank in this shared template.
  id: ''
  # string: STATIC | BRANCHING | OPEN
  type: STATIC
  # LOCAL — NOT SYNCED. Enables playable runs on this server.
  enabled: true
  # string. Name shown in menus, chat and titles.
  display_name: "&bNieuwe Dungeon"
  # bool. Show the display name in a title when the run begins.
  show_title_on_start: false
  start_title:
    # int ticks. Title fade-in duration used when show_title_on_start is true.
    fade_in_ticks: 10
    # int ticks. Title stay duration used when show_title_on_start is true.
    stay_ticks: 70
    # int ticks. Title fade-out duration used when show_title_on_start is true.
    fade_out_ticks: 10
  # string: NORMAL | NETHER | THE_END
  environment: NORMAL
  # string. Generator id, for example NATURAL, dungeons:void or dungeons:block.STONE.
  chunk_generator: dungeons:void

locations:
  lobby:
    # bool. Enable a lobby phase before the run starts.
    enabled: false
    # location or null. Keys: x, y, z, yaw, pitch.
    spawn: null
  # location or null. Player entry point for the dungeon.
  # Legacy single spawn; converted to starts when spawnpoints are edited.
  start: null
  # Multiple starts: /dungeon edit start add [name]. One random choice per instance.
  # starts:
  #   crypt: {x: 0.5, y: 64.0, z: 0.5, yaw: 0.0, pitch: 0.0}
  # LOCAL — NOT SYNCED. External destination on this server.
  exit: null
  # bool. True = always send leaving players to locations.exit.
  exit_on_leave: false

players:
  # string: SURVIVAL | ADVENTURE | CREATIVE | SPECTATOR
  gamemode: SURVIVAL
  # int. Lives per player. 0 = unlimited.
  lives: 0
  # bool. True = dead players become spectators. False = they are removed from the run.
  spectate_on_death: true
  # bool. Only used when spectate_on_death is true.
  close_when_everyone_spectates: true
  keep_on_entry:
    # bool flags. True = keep the player's current state on entry.
    inventory: true
    health: false
    food: false
    potion_effects: true
    experience: true
  # bool. Give dungeon-tagged items to remaining players when someone leaves.
  transfer_dungeon_items: true
  offline_kick:
    # bool. Remove disconnected players from active runs.
    enabled: true
    # int seconds. Delay before the offline player is removed.
    delay_seconds: 300
  # list[string]. Console commands run once for each player when they enter this dungeon.
  # Placeholders: {player}, <player>, %player% = player name; {uuid}, %uuid% = player UUID.
  join_commands: []

team:
  # int. Maximum players allowed to start this dungeon together.
  max_size: 4
  # int seconds. Grace period before a started run is shut down after team disband.
  disband_shutdown_delay_seconds: 180

runs:
  # int. Maximum active runs for this dungeon. 0 = unlimited.
  max_active: 10
  # int minutes. 0 = no time limit.
  time_limit_minutes: 0
  # list[int seconds]. Countdown moments that warn players before a timed run ends.
  time_limit_warning_seconds: [600, 300, 60]
  # int ticks. Delay before an empty run is cleaned up.
  cleanup_delay_ticks: 0

open:
  # int. Only used for OPEN dungeons. 0 = unlimited.
  max_players: 0
  # int ticks. Delay before an empty open run is unloaded.
  empty_unload_delay_ticks: 6000
  # bool. Keep one world preloaded for faster joins.
  preload_world: false

access:
  cooldown:
    # bool. Prevent players from starting again until the cooldown expires.
    enabled: false
    # bool. True = only the team leader must satisfy the cooldown.
    leader_only: false
    # bool flags. Choose when the cooldown should be applied.
    on_start: false
    on_finish: true
    on_leave: true
    on_lives_depleted: false
    # string: TIMER | HOURLY | DAILY | WEEKLY | MONTHLY
    period: TIMER
    # int. TIMER = minutes. DAILY/WEEKLY/MONTHLY = reset hour from 0 to 23.
    # HOURLY resets at the next full hour and ignores this value.
    value: 60
    # int. WEEKLY = 1-7. MONTHLY = 1-31.
    reset_day: 1
  keys:
    # bool. Consume a matching key when the run starts.
    consume_on_entry: true
    # bool. True = only the team leader needs a key.
    leader_only: false
    # list of access-key definitions. When plugin config access.keys.unique_validation_enabled = true,
    # issued physical keys are tracked separately in access_keys.yml.
    # Prefer editing this with /dungeon map keys add.
    items: []

difficulty:
  # bool. Enable named difficulty presets.
  enabled: false
  # bool. Show the difficulty menu before starting.
  use_menu: false
  presets:
    # map key. This id is used in commands and menus.
    HARD:
      icon:
        # string. Bukkit material name.
        material: DIAMOND
        # int. Use -1 to disable custom model data.
        custom_model_data: -1
        # string. Display name shown in the selector.
        display_name: "&cHard"
        # list of strings. Lore lines for the selector item.
        lore:
          - "&cOnly for the truest gamers."
      scaling:
        # decimal. 1.0 = unchanged, 1.5 = +50%.
        mob_health: 1.5
        # decimal. 1.0 = unchanged, 1.5 = +50%.
        mob_count: 1.5
        # decimal. 1.0 = unchanged, 1.25 = +25%.
        mob_damage: 1.25

generator:
  # Settings for branching dungeon maps; ignored by static and open maps.
  # string: branching | minecrafty
  layout: branching
  # material. Bukkit block name used to seal unused connectors. Use AIR to leave them open.
  seal_open_connectors_with: STONE
  room_target:
    # int. Minimum total rooms when layout = minecrafty.
    min: 8
    # int. Maximum total rooms when layout = minecrafty.
    max: 16
    # bool. True = fail generation if the minimum cannot be reached.
    enforce_minimum: true

  branching:
    # section. Used only when layout = branching.
    trunk:
      # list of room ids. Empty = all rooms.
      room_pool: []
      # list of room ids. Empty = automatic end room selection.
      end_room_pool: []
      # decimal from 0.0 to 1.0. Higher values prefer straighter paths.
      straightness: 0.5
      room_target:
        # int. Minimum rooms in the main path.
        min: 12
        # int. Maximum rooms in the main path.
        max: 24
        # bool. True = fail if the main path stays below the minimum.
        enforce_minimum: true
    # section. Add named branch ids here to enable optional side paths.
    branches: {}

