name: Dungeons
prefix: Dungeons
version: ${project.version}
main: nl.hauntedmc.dungeons.plugin.DungeonsPlugin
api-version: '26.3'
author: HauntedMC
depend: [DataProvider, DataRegistry]
softdepend: [ServerFeatures]
commands:
  dungeon:
    description: Main dungeon command
    usage: /<command>
    aliases: [du]

permissions:
  dungeons.staff.repo.inspect:
    description: Dungeon repository capability - inspect
    default: false
  dungeons.staff.repo.init:
    description: Dungeon repository capability - init
    default: false
  dungeons.staff.repo.publish:
    description: Dungeon repository capability - publish
    default: false
  dungeons.staff.repo.pull:
    description: Dungeon repository capability - pull
    default: false
  dungeons.staff.repo.force:
    description: Dungeon repository capability - force
    default: false
  dungeons.staff.queue:
    description: Cancel queued and pending dungeon admissions
    default: false
  dungeons.staff.backup:
    description: Dungeon staff capability - backup
    default: false
  dungeons.staff.cooldown:
    description: Dungeon staff capability - cooldown
    default: false
  dungeons.staff.delete:
    description: Dungeon staff capability - delete
    default: false
  dungeons.staff.diagnostics:
    description: Dungeon staff capability - diagnostics
    default: false
  dungeons.staff.edit:
    description: Dungeon staff capability - edit
    default: false
  dungeons.staff.inspect:
    description: Dungeon staff capability - inspect
    default: false
  dungeons.staff.keys:
    description: Dungeon staff capability - keys
    default: false
  dungeons.staff.lives:
    description: Dungeon staff capability - lives
    default: false
  dungeons.staff.maintenance:
    description: Dungeon staff capability - maintenance
    default: false
  dungeons.staff.observe:
    description: Dungeon staff capability - observe
    default: false
  dungeons.staff.progression:
    description: Dungeon staff capability - progression
    default: false
  dungeons.staff.purge:
    description: Dungeon staff capability - purge
    default: false
  dungeons.staff.recovery:
    description: Dungeon staff capability - recovery
    default: false
  dungeons.staff.reload:
    description: Dungeon staff capability - reload
    default: false
  dungeons.staff.remove:
    description: Dungeon staff capability - remove
    default: false
  dungeons.staff.rescue:
    description: Dungeon staff capability - rescue
    default: false
  dungeons.staff.restore:
    description: Dungeon staff capability - restore
    default: false
  dungeons.staff.restrict:
    description: Dungeon staff capability - restrict
    default: false
  dungeons.staff.scripts:
    description: Dungeon staff capability - scripts
    default: false
  dungeons.staff.timer:
    description: Dungeon staff capability - timer
    default: false
  dungeons.role.moderator:
    default: false
    children:
      dungeons.core: true
      dungeons.staff.inspect: true
      dungeons.staff.observe: true
      dungeons.staff.rescue: true
      dungeons.staff.remove: true
      dungeons.staff.queue: true
      dungeons.staff.restrict: true
  dungeons.role.builder:
    default: false
    children:
      dungeons.staff.repo.inspect: true
      dungeons.staff.repo.init: true
      dungeons.staff.maintenance: true
      dungeons.core: true
      dungeons.staff.inspect: true
      dungeons.staff.edit: true
      dungeons.staff.backup: true
  dungeons.role.administrator:
    default: false
    children:
      dungeons.staff.repo.inspect: true
      dungeons.staff.repo.init: true
      dungeons.staff.repo.publish: true
      dungeons.staff.repo.pull: true
      dungeons.staff.repo.force: true
      dungeons.core: true
      dungeons.staff.inspect: true
      dungeons.staff.observe: true
      dungeons.staff.rescue: true
      dungeons.staff.remove: true
      dungeons.staff.queue: true
      dungeons.staff.restrict: true
      dungeons.staff.cooldown: true
      dungeons.staff.progression: true
      dungeons.staff.lives: true
      dungeons.staff.timer: true
      dungeons.staff.edit: true
      dungeons.staff.keys: true
      dungeons.staff.reload: true
      dungeons.staff.recovery: true
      dungeons.staff.maintenance: true
      dungeons.staff.backup: true
      dungeons.staff.restore: true
      dungeons.staff.diagnostics: true
  dungeons.role.operator:
    default: op
    children:
      dungeons.staff.repo.inspect: true
      dungeons.staff.repo.init: true
      dungeons.staff.repo.publish: true
      dungeons.staff.repo.pull: true
      dungeons.staff.repo.force: true
      dungeons.core: true
      dungeons.staff.backup: true
      dungeons.staff.cooldown: true
      dungeons.staff.delete: true
      dungeons.staff.diagnostics: true
      dungeons.staff.edit: true
      dungeons.staff.inspect: true
      dungeons.staff.keys: true
      dungeons.staff.lives: true
      dungeons.staff.maintenance: true
      dungeons.staff.observe: true
      dungeons.staff.progression: true
      dungeons.staff.purge: true
      dungeons.staff.recovery: true
      dungeons.staff.reload: true
      dungeons.staff.remove: true
      dungeons.staff.queue: true
      dungeons.staff.rescue: true
      dungeons.staff.restore: true
      dungeons.staff.restrict: true
      dungeons.staff.scripts: true
      dungeons.staff.timer: true
  dungeons.bypass.cooldown:
    description: Explicit gameplay bypass, independent of staff access
    default: false
  dungeons.bypass.commands:
    description: Explicit gameplay bypass, independent of staff access
    default: false
